<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Review stories · simplify</title>
<style>
:root{--primary:#4F46E5;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--soft:#EEF2FF;--bg:#F9FAFB;--ok:#047857;--bad:#B91C1C}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:24px;margin:8px 0 4px} .sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tab,.btn{font:600 14px system-ui;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--soft);border-color:var(--primary);color:var(--primary)}
.btn.main{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.src{font-size:13px;color:var(--muted);margin-bottom:8px}
.src a{color:var(--primary)}
.raw{font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0 12px;color:#374151}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;font:15px/1.45 system-ui;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.tags label{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:4px 12px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.msg{padding:12px 14px;border-radius:12px;background:var(--soft);margin-bottom:16px}
.msg.err{background:#FEF2F2;color:var(--bad)}
.hint{font-size:12px;color:var(--muted)}
a{color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Review stories</h1>
  <p class="sub">AI drafts the story from a headline and snippet. Check every fact against the original before approving.</p>
  <div id="status"></div>
  <div id="app" hidden>
    <div class="bar" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="review.js"></script>
</body>
</html>
